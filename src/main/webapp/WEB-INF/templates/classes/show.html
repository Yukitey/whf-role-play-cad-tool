<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>WHF Role Play Cad Tool</title>
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/theme.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/general.css}" />
</head>
<body class="page-layout">
<header th:replace="~{fragments/header :: header}">Header</header>
<div class="page-content-panel-layout">
    <h1 th:text="${characterClass}" class="page-title"></h1>
    <div th:each="career: ${characterClass.getAvailableCareers()}">
        <a th:href="@{/classes/{classId}/{careerId}(classId = ${characterClass.getName()}, careerId = ${career.getId()})}" th:text="${career.getId()}" />
    </div>
</div>
<header th:replace="~{fragments/footer :: footer}">Footer</header>
</body>
</html>
